name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck 2>&1 | grep -E '^(src/|mini-services/)' && exit 1 || exit 0

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify build output
        run: test -f .next/standalone/server.js

      - name: Generate release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/## \[${VERSION#v}\]/{flag=1} /## \[/{if(flag==1)exit} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            # StudentTemp ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}

            ---

            **Developed by Roshan** | **Contributor:** ManashBhoi
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
