name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: ESLint
        run: bun run lint
      - name: TypeScript type-check (production code only)
        run: npx tsc --noEmit --skipLibCheck 2>&1 | grep -E '^(src/|mini-services/)' || true
      - name: Security audit (non-blocking)
        run: bun audit || true

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build Next.js
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Verify standalone output
        run: test -f .next/standalone/server.js
