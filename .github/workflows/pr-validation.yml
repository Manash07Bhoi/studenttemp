name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Check PR title (Conventional Commits)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            echo "::notice::PR title follows Conventional Commits: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits format: type(scope): description"
            echo "Got: $PR_TITLE"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck 2>&1 | grep -E '^(src/|mini-services/)' && exit 1 || exit 0

      - name: Check for forbidden tokens
        run: |
          # Check for TODO, FIXME, console.log in production code
          if grep -rnE '(TODO|FIXME|XXX)\b' src/ --include='*.ts' --include='*.tsx' | grep -v 'ST-XXXX'; then
            echo "::error::Found TODO/FIXME/XXX in source code"
            exit 1
          fi
          if grep -rn 'console\.log' src/ --include='*.ts' --include='*.tsx'; then
            echo "::error::Found console.log in source code"
            exit 1
          fi
          # Check for mock/fake/placeholder in production code (excluding comments)
          if grep -rnE '\b(mock|dummy|fake)\b' src/ --include='*.ts' --include='*.tsx' | grep -v '^\s*//' | grep -v 'no mock' | grep -v 'not a mock' | grep -v 'no fake'; then
            echo "::error::Found mock/dummy/fake references in production code"
            exit 1
          fi
          echo "::notice::No forbidden tokens found"

      - name: Verify .env is not in the diff
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^\.env$|^\.env\.production$'; then
            echo "::error::.env or .env.production is in the PR diff — remove it!"
            exit 1
          fi
          echo "::notice::No .env files in diff"

      - name: Build verification
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
