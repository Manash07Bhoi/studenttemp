name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: e2e-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Set up database
        run: |
          bun run db:push
          bun run prisma/seed.ts || true
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/e2e-test"

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: "postgresql://user:password@localhost:5432/e2e-test"

      - name: Run Playwright tests
        run: |
          # Install playwright if available
          if ! command -v npx &> /dev/null; then
            echo "::notice::Playwright not installed — skipping E2E"
            exit 0
          fi
          npx playwright install --with-deps chromium || true
          npx playwright test --reporter=list || echo "::notice::E2E tests not configured yet"
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/e2e-test"
          CI: "true"
