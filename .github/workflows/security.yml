name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run bun audit
        run: bun audit --production || true
      - name: Check for critical vulnerabilities
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          if echo "$AUDIT_OUTPUT" | grep -q "critical"; then
            echo "::error::Critical vulnerabilities found"
            echo "$AUDIT_OUTPUT"
            exit 1
          fi
          echo "::notice::No critical vulnerabilities"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      - name: Check for leaked secrets
        run: |
          # Check for common secret patterns in tracked files
          SECRETS_FOUND=0
          for pattern in "VAPID_PRIVATE_KEY=" "RESEND_API_KEY=" "DATABASE_URL=postgresql" "TOTP_ENCRYPTION_KEY=" "SITE_ACCESS_PASSWORD_HASH="; do
            if git log --all -p | grep -q "$pattern" | grep -v ".env.example" | grep -v ".gitignore"; then
              echo "::warning::Pattern found in git history: $pattern"
              SECRETS_FOUND=1
            fi
          done
          if [ "$SECRETS_FOUND" -eq 1 ]; then
            echo "::warning::Potential secrets found in git history. Review and rotate if needed."
          fi
      - name: Check .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git!"
            exit 1
          fi
          if git ls-files --error-unmatch .env.production 2>/dev/null; then
            echo "::error::.env.production is tracked in git!"
            exit 1
          fi
          echo "::notice::No .env files tracked"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
