name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Run dependency audit
        run: |
          AUDIT_OUTPUT=$(bun i --no-save && npm audit 2>&1 || true)
          # Strictly fail ONLY if critical vulnerabilities are found, to enforce high security standards without blocking on smaller issues unnecessarily.
          if echo "$AUDIT_OUTPUT" | grep -q "critical"; then
            echo "::error::Critical vulnerabilities found"
            echo "$AUDIT_OUTPUT"
            exit 1
          fi
          echo "::notice::Audit completed."
