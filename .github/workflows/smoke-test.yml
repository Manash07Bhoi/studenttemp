name: Deployment Smoke Tests

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Determine deployment URL
        id: url
        run: |
          # Check if deployed on Render
          RENDER_URL="${{ secrets.RENDER_DEPLOY_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "::notice::RENDER_DEPLOY_URL secret not set — skipping smoke test"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "url=$RENDER_URL" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Wait for deployment to be ready
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Waiting for $URL to be ready..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Site is live after ${i}0 seconds"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Site did not come up within 10 minutes"
          exit 1

      - name: Verify HTTPS
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          if [[ "$URL" != https://* ]]; then
            echo "::error::Deployment URL is not HTTPS"
            exit 1
          fi
          echo "::notice::HTTPS verified"

      - name: Check security headers
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          HEADERS=$(curl -sSI "$URL")
          for header in "Strict-Transport-Security" "Content-Security-Policy" "X-Content-Type-Options" "X-Frame-Options" "Referrer-Policy"; do
            if echo "$HEADERS" | grep -qi "$header"; then
              echo "::notice::$header present"
            else
              echo "::warning::$header missing"
            fi
          done

      - name: Check API health
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          API_RESPONSE=$(curl -s "$URL/api/domains" 2>/dev/null)
          if echo "$API_RESPONSE" | grep -q "domains"; then
            echo "::notice::API is responding correctly"
          else
            echo "::error::API is not responding correctly"
            echo "$API_RESPONSE"
            exit 1
          fi

      - name: Check site access gate
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          GATE_RESPONSE=$(curl -s "$URL/api/site-access/verify" 2>/dev/null)
          if echo "$GATE_RESPONSE" | grep -q "gateEnabled"; then
            echo "::notice::Site access gate is working"
          else
            echo "::warning::Site access gate response unexpected"
          fi

      - name: Check static assets
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          # Check if CSS loads
          CSS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/_next/static/chunks/" 2>/dev/null || echo "404")
          if [ "$CSS_STATUS" != "404" ]; then
            echo "::notice::Static assets are accessible"
          fi

      - name: Check 404 page
        if: steps.url.outputs.skip != 'true'
        run: |
          URL="${{ steps.url.outputs.url }}"
          STATUS_404=$(curl -s -o /dev/null -w "%{http_code}" "$URL/nonexistent-page-12345" 2>/dev/null)
          if [ "$STATUS_404" = "404" ] || [ "$STATUS_404" = "200" ]; then
            echo "::notice::404 handling works (status: $STATUS_404)"
          else
            echo "::warning::Unexpected status for 404 page: $STATUS_404"
          fi
