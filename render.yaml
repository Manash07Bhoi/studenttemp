# Render Configuration — StudentTemp
# https://render.com/docs/blueprint-spec
#
# This file tells Render how to deploy the project.
# Secrets are NOT hardcoded here — they must be set in the Render dashboard
# (Settings → Environment Variables) or via the Render CLI.
# Use .env.example as a reference for which variables to set.

services:
  - type: web
    name: studenttemp-web
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    preDeployCommand: bun run db:deploy && bun run prisma/seed.ts
    startCommand: bun run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studenttemp-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_HOSTS
        value: 127.0.0.1,::1,localhost
      - key: SMTP_RELAY_HOST
        value: localhost
      - key: SMTP_RELAY_PORT
        value: "2525"
      # The following must be set manually in Render dashboard:
      # - NEXT_PUBLIC_VAPID_PUBLIC_KEY (generate with: npx web-push generate-vapid-keys)
      # - VAPID_PRIVATE_KEY (from the same command — NEVER commit)
      # - SITE_ACCESS_PASSWORD_HASH (SHA-256 of your password)
      # - RESEND_API_KEY (from resend.com)(from resend.com)
      # - TOTP_ENCRYPTION_KEY (generate with: openssl rand -hex 32)
      # - PUBLIC_BASE_URL (set after first deploy to your Render URL)

  - type: worker
    name: studenttemp-mail
    runtime: node
    plan: free
    buildCommand: bun install && bun run db:generate && cd mini-services/mail-service && bun install
    startCommand: cd mini-services/mail-service && bun run index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studenttemp-db
          property: connectionString
      # The following must be set manually in Render dashboard:
      # - NEXT_PUBLIC_VAPID_PUBLIC_KEY
      # - VAPID_PRIVATE_KEY

databases:
  - name: studenttemp-db
    plan: free
    ipAllowList: []
